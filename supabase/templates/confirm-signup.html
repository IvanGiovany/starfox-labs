<!--
  Supabase → Authentication → Emails → Templates → "Confirm signup"

  SUBJECT (paste into the Subject field):
  Your Starfox Labs sign-up code: {{ .Token }}

  BODY: paste everything below this comment into the message body (source/HTML view).

  Notes:
  - {{ .Token }} is the 6-digit code; {{ .TokenHash }} powers the one-tap link.
  - The link goes to {{ .SiteURL }} (https://starfoxlabs.org). On localhost, type the code instead.
  - next={{ .RedirectTo }} is the page to go back to (the login form's emailRedirectTo,
    a full URL on this site; app/auth/confirm accepts only this site). Without one,
    Supabase fills in the Site URL and the reader lands on the home page.
  - Sent the first time an email address signs in (a new reader). Returning
    readers get "Magic Link": magic-link.html. Keep the two in step.
  - "15 minutes" assumes Authentication → Providers → Email → Email OTP Expiration = 900.
-->
<div style="background:#f7f3ec;padding:32px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#2a2521;">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:12px;padding:32px;">
    <p style="margin:0 0 24px;font-family:Georgia,'Times New Roman',serif;font-size:22px;">Starfox Labs</p>
    <p style="margin:0 0 8px;font-size:16px;">Welcome! Your code to finish signing up:</p>
    <p style="margin:0 0 24px;font-family:Consolas,Menlo,'Courier New',monospace;font-size:32px;font-weight:bold;letter-spacing:6px;">{{ .Token }}</p>
    <p style="margin:0 0 16px;font-size:16px;">Or sign in with one tap:</p>
    <p style="margin:0 0 32px;">
      <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next={{ .RedirectTo }}"
         style="display:inline-block;background:#51247a;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:8px;font-size:16px;">Finish signing up</a>
    </p>
    <p style="margin:0;font-size:13px;line-height:1.5;color:#6e655c;">The code and the button work once and expire in 15 minutes. If you didn't ask to sign up, you can ignore this email and no account will be made.</p>
  </div>
</div>
